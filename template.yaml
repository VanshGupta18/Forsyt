AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Forsyt shared API cache table (see comments for scope and local setup).

# Scope: this declares one DynamoDB table and nothing else. The data pipelines
# deliberately stay on GitHub Actions cron — they are already free there, and
# the NLP steps (torch, sentence-transformers) would not fit Lambda's 15-minute
# ceiling. The only thing here that pays for itself is the cache:
# news_dataset/api/cache.py is an in-process dict, which is why
# news_dataset/gunicorn.conf.py pins workers=1. Moving that store out of process
# is what turns workers>1 into a config change rather than a rewrite.
#
# Local development needs no AWS account — run it against LocalStack (see
# docker-compose.yml):
#
#   sam validate --lint
#   aws dynamodb create-table --endpoint-url http://localhost:4566 \
#     --table-name forsyt-api-cache --billing-mode PAY_PER_REQUEST \
#     --attribute-definitions AttributeName=scope,AttributeType=S \
#                             AttributeName=cache_key,AttributeType=S \
#     --key-schema AttributeName=scope,KeyType=HASH \
#                  AttributeName=cache_key,KeyType=RANGE
#
# or, from Python, news_dataset.api.cache.ensure_table().

Resources:
  ApiCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: forsyt-api-cache
      # Read volume is a handful of keys for <10 concurrent users; on-demand
      # keeps this inside the perpetual free tier rather than provisioning
      # capacity that would idle.
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: scope
          AttributeType: S
        - AttributeName: cache_key
          AttributeType: S
      KeySchema:
        # Constant partition + cache key as sort key, so prefix invalidation
        # (cache_invalidate_prefix) is a begins_with Query rather than a scan.
        - AttributeName: scope
          KeyType: HASH
        - AttributeName: cache_key
          KeyType: RANGE
      TimeToLiveSpecification:
        # Garbage collection only. Freshness is enforced at read time, because
        # cache_get() takes ttl_seconds per call rather than per stored row.
        AttributeName: expires_at
        Enabled: true

Outputs:
  ApiCacheTableName:
    Description: Value for the FORSYT_CACHE_TABLE environment variable
    Value: !Ref ApiCacheTable
