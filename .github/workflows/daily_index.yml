name: Daily India GPR Index

on:
  schedule:
    # Once daily at 18:30 UTC (~ midnight IST) after news scrape cycles
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  daily-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the refreshed index CSVs back to the repo
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore india processed parquets
        uses: actions/cache/restore@v4
        id: parquet-cache
        with:
          path: gpr_index/data/india_processed
          key: india-processed-parquets-v1
          restore-keys: |
            india-processed-parquets-v1

      - name: Ensure parquet directory exists
        run: mkdir -p gpr_index/data/india_processed

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install news pipeline dependencies
        run: pip install -r news_dataset/requirements.txt pandas pyarrow

      - name: Install NLP dependencies
        run: pip install -r news_dataset/requirements-nlp.txt

      - name: Install GPR index dependencies
        run: pip install -r gpr_index/requirements.txt

      - name: Install NIFTY modelling dependencies
        run: pip install -r nifty-50/requirements.txt

      - name: Run daily index pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INDIA_GPR_INDEX_START: '2026-08-09'
          MIN_PARQUET_DAYS_FOR_GPR: '7'
          PARQUET_BACKFILL_LOOKBACK_DAYS: '14'
        run: python -m news_dataset.pipeline.daily_index

      - name: Commit refreshed index CSVs
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gpr_index/outputs/*.csv
          if git diff --cached --quiet; then
            echo "No index changes to commit."
          else
            git commit -m "chore(data): refresh GPR index CSVs [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Save india processed parquets
        uses: actions/cache/save@v4
        if: success()
        with:
          path: gpr_index/data/india_processed
          key: india-processed-parquets-v1

      # Generates each corridor's daily "why this score" explanation. Runs a
      # small local model via Ollama on this runner (installed + pulled fresh
      # below, torn down when the job ends) rather than a live inference
      # server — no API key, no external account, no always-on host needed.
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and pull model
        run: |
          ollama serve &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull llama3.2:1b

      - name: Install AI explanation dependencies
        run: pip install -r news_dataset/requirements-ai.txt

      - name: Run corridor explanation pipeline
        if: success()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OLLAMA_MODEL_ID: llama3.2:1b
        run: python -m news_dataset.pipeline.explain_corridors
