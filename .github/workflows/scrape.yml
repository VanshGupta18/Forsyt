name: Geopolitics News Ingestion

on:
  schedule:
    # Runs every 25 minutes — geo_scheduler.py's due-tier check enforces the
    # actual Tier 1 (~7min) / Tier 2 (~12min) cadence internally.
    - cron: '*/25 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './news_dataset/requirements.txt'

      - name: Install dependencies
        run: pip install -r news_dataset/requirements.txt

      - name: Run geopolitics pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m news_dataset.ingestion.geo_scheduler --once
